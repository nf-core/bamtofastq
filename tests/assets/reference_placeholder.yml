# Test fixture for ${params.references_base_path} substitution (nf-schema
# validation.allowParamsSubstitution). The placeholder carries the leading
# slash; the base path must not end with one. The test sets
# references_base_path to the test-datasets root so both paths resolve to
# the same small chromosome the other references tests use.
- genome: GRCh38_chr21
  fasta: ${params.references_base_path}/references/references/GRCh38_chr21/GRCh38_chr21.fa
  fasta_fai: ${params.references_base_path}/references/references/GRCh38_chr21/GRCh38_chr21.fa.fai
  reference_source: nf-core
  species: Homo_sapiens
